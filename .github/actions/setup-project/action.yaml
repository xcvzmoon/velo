name: Setup project
description: Install project toolchains and dependencies.

runs:
  using: composite
  steps:
    - name: Install Tauri dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

    - name: Setup pnpm and Node.js
      uses: pnpm/setup@v3.0.0
      with:
        version: '12.6.0'
        runtime: node@26
        cache: true
        install: false

    - name: Setup Rust
      shell: bash
      run: rustup show active-toolchain

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2
      with:
        workspaces: '. -> target'
        shared-key: desktop
        add-job-id-key: false
        save-if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
