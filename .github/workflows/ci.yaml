name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Lint
        run: pnpm lint

      - name: Check generated bindings
        run: pnpm bindings:check

      - name: Check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build installers
        run: pnpm build --ci

      - name: Retain installers for platform verification
        uses: actions/upload-artifact@v4
        with:
          name: velo-${{ matrix.os }}-${{ github.sha }}
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 7

  ui:
    name: UI workflows and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Test UI
        run: pnpm test:ui --workers=2

      - name: Retain UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velo-ui-${{ github.sha }}
          path: test-results/
          retention-days: 7
