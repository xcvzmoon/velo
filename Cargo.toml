[workspace]
members = ["crates/velo-engine", "crates/velo-contracts", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Mon Albert Gamil <mrgamilmonalbert@gmail.com>"]
repository = "https://github.com/xcvzmoon/velo"

[workspace.dependencies]
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
cookie_store = { version = "0.22", default-features = false }
aho-corasick = "1"
percent-encoding = "2"
serde_path_to_error = "0.1"
shlex = "2"
axum = { version = "0.8", default-features = false }
hdrhistogram = { version = "7.6", default-features = false }
keyring = "3.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
reqwest = { version = "0.13", default-features = false }
rusqlite = "0.38"
serde = "1"
serde_json = "1"
tauri = "2.12.0"
tauri-build = "2.7.0"
tauri-plugin-dialog = "2"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
ts-rs = "12"
uuid = "1"
velo-contracts = { path = "crates/velo-contracts", version = "0.0.0" }
velo-engine = { path = "crates/velo-engine", version = "0.0.0" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
redundant_lifetimes = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
