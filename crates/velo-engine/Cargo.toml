[package]
name = "velo-engine"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[dependencies]
hdrhistogram = { version = "7.6", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["net", "io-util", "test-util"] }
