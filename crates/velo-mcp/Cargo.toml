[package]
name = "velo-mcp"
description = "Local MCP authoring and redacted evidence server for Velo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
velo-contracts.workspace = true
velo-engine.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util"] }

[lints]
workspace = true
