[package]
name = "velo"
default-run = "velo"
description = "A lightweight, native API load-testing studio powered by Rust"
version = "0.0.0"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
rusqlite = { workspace = true, features = ["bundled"] }
keyring = { workspace = true, features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
uuid = { workspace = true, features = ["v4"] }
tokio = { workspace = true, features = ["sync"] }
velo-contracts.workspace = true
velo-engine.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
tauri = { workspace = true, features = ["macos-private-api"] }
tauri-plugin-dialog.workspace = true

[dev-dependencies]
tempfile.workspace = true
tauri = { workspace = true, features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSApplication"] }

[lints]
workspace = true
