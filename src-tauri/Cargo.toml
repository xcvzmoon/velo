[package]
name = "velo"
default-run = "velo"
description = "A lightweight, native API load-testing studio powered by Rust"
version = "0.0.0"
authors = ["Mon Albert Gamil <mrgamilmonalbert@gmail.com>"]
license = "MIT"
repository = "https://github.com/xcvzmoon/velo"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tokio = { version = "1", features = ["sync"] }
velo-contracts = { path = "../crates/velo-contracts" }
velo-engine = { path = "../crates/velo-engine" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tauri = { version = "2.12.0", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication"] }
